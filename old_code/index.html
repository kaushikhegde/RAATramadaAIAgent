<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flight Plan Generator</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    padding:40px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input, textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    background:#007bff;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.print-area{
    margin-top:30px;
    padding:20px;
    border:1px solid #ddd;
}

.ticket{
    padding:20px;
}

.ticket h2{
    text-align:center;
}

.row{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}

.label{
    font-weight:bold;
}

/* Hide form when printing */
@media print{
    .form-area, button{
        display:none;
    }

    body{
        background:white;
    }

    .print-area{
        border:none;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="form-area">

<h2>Flight Planner</h2>

<label>Flight Source</label>
<input id="source">

<label>Destination</label>
<input id="destination">

<label>From Date</label>
<input type="date" id="fromDate">

<label>To Date</label>
<input type="date" id="toDate">

<label>Budget</label>
<input id="budget">

<label>Passenger Info</label>
<textarea id="passengers"></textarea>

<button onclick="generate()">Generate & Print</button>

</div>


<div class="print-area">
<div class="ticket">

<h2>Flight Travel Plan</h2>

<div class="row">
<div><span class="label">From:</span> <span id="p_source"></span></div>
<div><span class="label">To:</span> <span id="p_destination"></span></div>
</div>

<div class="row">
<div><span class="label">Departure:</span> <span id="p_fromDate"></span></div>
<div><span class="label">Return:</span> <span id="p_toDate"></span></div>
</div>

<div class="row">
<div><span class="label">Budget:</span> ₹<span id="p_budget"></span></div>
</div>

<div style="margin-top:20px">
<div class="label">Passengers</div>
<div id="p_passengers"></div>
</div>

</div>
</div>

</div>


<script>

function generate(){

document.getElementById("p_source").innerText =
document.getElementById("source").value;

document.getElementById("p_destination").innerText =
document.getElementById("destination").value;

document.getElementById("p_fromDate").innerText =
document.getElementById("fromDate").value;

document.getElementById("p_toDate").innerText =
document.getElementById("toDate").value;

document.getElementById("p_budget").innerText =
document.getElementById("budget").value;

document.getElementById("p_passengers").innerText =
document.getElementById("passengers").value;

window.print();

}

</script>

</body>
</html>
